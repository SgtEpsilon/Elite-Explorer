name: Release

# Runs whenever a tag matching v*.*.* is pushed.
#   git tag v0.2.0            && git push origin v0.2.0            -> stable release
#   git tag v0.2.0-beta.1     && git push origin v0.2.0-beta.1     -> beta prerelease
on:
  push:
    tags:
      - 'v*.*.*'

# Lets the built-in GITHUB_TOKEN create/update releases and upload assets.
permissions:
  contents: write

jobs:
  release:
    strategy:
      # If one platform fails to build, let the others keep going.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tags containing "-beta" publish via the beta channel/config,
      # anything else (v0.2.0, v1.0.0, ...) publishes as a normal stable release.
      - name: Publish (stable)
        if: ${{ !contains(github.ref_name, '-beta') }}
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (beta)
        if: ${{ contains(github.ref_name, '-beta') }}
        run: npx electron-builder --publish always --config electron-builder.beta.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
